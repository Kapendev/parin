<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧶</text></svg>">
<script>

class WebAssemblyExit extends Error {
    constructor(code) {
        super(`Exited with code ${code}`);
        this.name = "WebAssemblyExit";
        this.code = code;
    }
}

let decoder = new TextDecoder();
let memory = null;
let outBuffer = "";

const wasi_snapshot_preview1 = {
    fd_write(fd, iovecPtr, iovecLen, nwrittenPtr) {
        let view = new DataView(memory.buffer);
        let written = 0;
        if (fd !== 1 && fd !== 2) { view.setUint32(nwrittenPtr, written, true); return 0; }

        for (let i = 0; i < iovecLen; i += 1) {
            const ptr = view.getUint32(iovecPtr + i * 8, true);
            const len = view.getUint32(iovecPtr + i * 8 + 4, true);
            outBuffer += decoder.decode(new Uint8Array(memory.buffer, ptr, len));
            written += len;
        }
        if (outBuffer.includes("\n")) {
            const lines = outBuffer.split("\n");
            outBuffer = lines.pop();
            for (const line of lines) console.log(line);
        }
        view.setUint32(nwrittenPtr, written, true);
        return 0;
    },

    proc_exit(code) {
        throw new WebAssemblyExit(code);
    },

    clock_res_get(clockId, resPtr) {
        let view = new DataView(memory.buffer);
        view.setBigUint64(resPtr, 1000000n, true);
        return 0;
    },

    clock_time_get(clockId, precision, timePtr) {
        let view = new DataView(memory.buffer);
        let nanos = (clockId === 1) ? BigInt(Math.round(performance.now() * 1e6)) : BigInt(Date.now()) * 1000000n;
        view.setBigUint64(timePtr, nanos, true);
        return 0;
    },
};

function flushOutBuffer() {
    if (!outBuffer) return;
    console.log(outBuffer);
    outBuffer = "";
}

function runWebAssemblyEntryPoint(func) {
    let result = 0;
    try {
        result = func();
        if (result === undefined) result = 1
    } catch (e) {
        if (e instanceof WebAssemblyExit) {
            console.log(e);
            result = e.code;
        } else {
            throw e;
        }
    } finally {
        flushOutBuffer();
    }
    return result;
}

(async () => {
    const resource = await fetch("index.wasm");
    const { instance } = await WebAssembly.instantiate(await resource.arrayBuffer(), { wasi_snapshot_preview1 });
    const startFunc  = instance.exports._start;
    const updateFunc = instance.exports._update;
    memory = instance.exports.memory;
    runWebAssemblyEntryPoint(startFunc);

    if (typeof updateFunc === "function") {
        function frame(now) {
            const dt = (now - last) / 1000;
            last = now;

            let canRequest = false;
            try {
                canRequest = !updateFunc(dt);
            } finally {
                flushOutBuffer();
            }
            if (canRequest) requestAnimationFrame(frame);
        }

        let last = performance.now();
        requestAnimationFrame(frame);
    }
})();

</script>
</head>
<body style="background-color:#606060; color: white; font-size: 200%;">
<h1>✨ Hello D World ✨</h1>
<p>Press F12 to see the count...</p>
</body>
</html>
